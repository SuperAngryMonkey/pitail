<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiTail — Login</title>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --accent: #58a6ff; --danger: #f85149; --text: #c9d1d9; --muted: #8b949e;
      --font: 'SF Mono','Fira Code','Consolas',monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(88,166,255,.05) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(63,185,80,.04) 0%, transparent 50%);
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 360px;
    }
    .login-icon {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-icon svg { color: var(--accent); }
    h1 {
      text-align: center;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .login-sub {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 10px 12px;
      width: 100%;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      padding: 11px;
      cursor: pointer;
      letter-spacing: 1px;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn-login:hover { background: #79c0ff; }
    .error-msg {
      background: rgba(248,81,73,.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      margin-bottom: 16px;
    }
    .login-hint {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83
               M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
    </svg>
  </div>
  <h1>PITAIL</h1>
  <div class="login-sub">// network management</div>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="error-msg">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username"
             autofocus placeholder="admin">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password"
             placeholder="••••••••">
    </div>
    <button type="submit" class="btn-login">SIGN IN</button>
  </form>

  <div class="login-hint">
    Default credentials: admin / pitail<br>
    Change password in Settings after login.
  </div>
</div>
</body>
</html>
